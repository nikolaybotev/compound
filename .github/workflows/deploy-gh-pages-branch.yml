name: deploy-gh-pages-branch

# Publishes the orphan gh-pages branch tree to GitHub Pages via Actions.
# Live site content matches the gh-pages tip (production, prototype/, feat/).
# No build. This workflow file lives on main only so a gh-pages commit cannot
# change the deployer. Triggered by workflow_dispatch (including from publish
# workflows after they push gh-pages).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Verify site root
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          test -f .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
