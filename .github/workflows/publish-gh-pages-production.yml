name: publish-gh-pages-production

# Commits production root files onto orphan gh-pages. Live traffic is published
# by deploy-gh-pages-branch.yml (workflow_dispatch), including after each push
# here. Does not build, copy, update, or delete prototype/ or feat/.
# deploy-pages.yml is manual rollback only. Tags production gh-pages commits 0.6.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: main/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: main
        run: pnpm install --frozen-lockfile

      - name: Build production
        working-directory: main
        env:
          VITE_BASE: /compound/
        run: pnpm --dir apps/web build

      - name: Assemble staging
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -a main/apps/web/dist/. staging/
          test -f staging/index.html
          test -d staging/assets
          grep -q '/compound/' staging/index.html
          if grep -q '/compound/prototype/' staging/index.html; then
            echo "production index references /compound/prototype/" >&2
            exit 1
          fi

      - name: Publish production root to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_POINT_VERSION: "0.6"
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: |
          set -euo pipefail
          rm -f "${GH_PAGES_PUSH_MARKER}"
          MSG="Production publish from main ${{ github.sha }}"
          bash main/.github/scripts/gh-pages-publish.sh production "${MSG}" "${GITHUB_WORKSPACE}/staging"

      - name: Deploy gh-pages tree to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: bash main/.github/scripts/dispatch-deploy-gh-pages-branch.sh
