name: publish-gh-pages-production

# Commits production root files onto orphan gh-pages. Live traffic is published
# by deploy-gh-pages-branch.yml (workflow_dispatch), including after each push
# here. Does not build, copy, update, or delete prototype/ or feat/.
# deploy-pages.yml is manual rollback only. Tags a production gh-pages
# commit with PAGES_POINT_VERSION when that tag is not already on the remote.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_gh_pages:
        description: Dispatch deploy-gh-pages-branch even when gh-pages did not change
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: main/package.json

      - name: Read Node.js version
        id: node
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^node = / { print $2; exit }' main/mise.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
          cache-dependency-path: main/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: main
        run: pnpm install --frozen-lockfile

      - name: Build production
        working-directory: main
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          name="${repo##*/}"
          VITE_BASE="/${name}/" pnpm --dir apps/web build

      - name: Assemble staging
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          name="${repo##*/}"
          base="/${name}/"
          prototype="/${name}/prototype/"
          mkdir -p staging
          cp -a main/apps/web/dist/. staging/
          test -f staging/index.html
          test -d staging/assets
          grep -q "$base" staging/index.html
          if grep -q "$prototype" staging/index.html; then
            echo "production index references ${prototype}" >&2
            exit 1
          fi

      - name: Publish production root to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: |
          set -euo pipefail
          rm -f "${GH_PAGES_PUSH_MARKER}"
          version="$(node -p "require('./main/apps/web/package.json').version")"
          if [[ "$version" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            export PAGES_POINT_VERSION="${BASH_REMATCH[1]}"
          else
            export PAGES_POINT_VERSION="$version"
          fi
          MSG="Production publish from main ${{ github.sha }}"
          bash main/.github/scripts/gh-pages-publish.sh production "${MSG}" "${GITHUB_WORKSPACE}/staging"

      - name: Bootstrap deploy when deploy workflow changes on main
        id: bootstrap_deploy
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        working-directory: main
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -qF '.github/workflows/deploy-gh-pages-branch.yml'; then
            echo "force=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy gh-pages tree to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
          FORCE_GH_PAGES_DEPLOY: ${{ steps.bootstrap_deploy.outputs.force == '1' || (github.event_name == 'workflow_dispatch' && inputs.deploy_gh_pages) && '1' || '' }}
        run: bash main/.github/scripts/dispatch-deploy-gh-pages-branch.sh
