name: publish-gh-pages-production

# After cutover, GitHub Pages serves orphan branch gh-pages. This job updates
# only production root files (index.html and assets/). It does not build, copy,
# update, or delete prototype/ or feat/. deploy-pages.yml still ships
# production and prototype/ until cutover.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: main/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: main
        run: pnpm install --frozen-lockfile

      - name: Build production
        working-directory: main
        env:
          VITE_BASE: /compound/
        run: pnpm --dir apps/web build

      - name: Assemble staging
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -a main/apps/web/dist/. staging/
          test -f staging/index.html
          test -d staging/assets
          grep -q '/compound/' staging/index.html
          if grep -q '/compound/prototype/' staging/index.html; then
            echo "production index references /compound/prototype/" >&2
            exit 1
          fi

      - name: Publish production root to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_POINT_VERSION: "0.6"
        run: |
          set -euo pipefail
          MSG="Production publish from main ${{ github.sha }}"
          bash main/.github/scripts/gh-pages-publish.sh production "${MSG}" "${GITHUB_WORKSPACE}/staging"
