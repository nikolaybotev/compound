name: deploy-pages

# Rollback publisher only (workflow_dispatch). Rebuilds production and
# prototype/ from git refs and uploads one artifact. Live traffic after
# gh-pages cutover uses deploy-gh-pages-branch.yml (no build). The
# github-pages environment stays limited to main. The job commits nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish under prototype/
        required: false
        default: complete-loan-picture
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Two directories so the second checkout cannot replace the first tree.
      # Vite writes apps/web/dist inside each checkout.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # On push, inputs.ref is empty, so the prototype ref defaults to
      # complete-loan-picture. It is not github.sha. A missing ref does not
      # fail the job: the next step copies main into prototype/.
      - name: Check out prototype
        id: prototype_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'complete-loan-picture' }}
          path: prototype

      - name: Use main when the prototype ref is missing
        if: steps.prototype_checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          rm -rf prototype
          mkdir -p prototype
          cp -a main/. prototype/

      # package.json is under each checkout, not the workspace root.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: main/package.json

      - name: Read Node.js version
        id: node
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^node = / { print $2; exit }' main/mise.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
          cache-dependency-path: |
            main/pnpm-lock.yaml
            prototype/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: main
        run: pnpm install --frozen-lockfile

      - name: Install prototype dependencies
        working-directory: prototype
        run: pnpm install --frozen-lockfile

      - name: Build production
        working-directory: main
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          name="${repo##*/}"
          VITE_BASE="/${name}/" pnpm --dir apps/web build

      - name: Build prototype
        working-directory: prototype
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          name="${repo##*/}"
          VITE_BASE="/${name}/prototype/" pnpm --dir apps/web build

      - name: Assemble site
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          name="${repo##*/}"
          base="/${name}/"
          prototype="/${name}/prototype/"
          mkdir -p site/prototype
          cp -a main/apps/web/dist/. site/
          cp -a prototype/apps/web/dist/. site/prototype/
          test -f site/index.html
          test -f site/prototype/index.html
          grep -q "$base" site/index.html
          grep -q "$prototype" site/prototype/index.html
          if grep -q "$prototype" site/index.html; then
            echo "production index references ${prototype}" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
