name: deploy-pages

# Publishes one GitHub Pages site. Push to main and manual dispatch only.
# The page has no external data, so this workflow does not republish on a timer.
# The job commits nothing.
#
# This is the only Pages upload. A push to main rebuilds production at the
# site root from main and prototype/ beside it. Uploading production alone
# would delete https://nikolaybotev.github.io/compound/prototype/. The
# github-pages environment stays limited to main; this workflow does not
# widen it. If the prototype ref cannot be checked out, the prototype build
# uses the main tree and the production upload still happens.
#
# Pull-request previews live under feat/<number>/ on branch pages-feat.
# deploy-feature-preview.yml writes that branch and dispatches
# deploy-feat-pages.yml, which mirrors the live site and overlays feat/
# without rebuilding production. Pushes to main still rebuild here and
# merge pages-feat/feat into this artifact before upload.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish under prototype/
        required: false
        default: complete-loan-picture
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Two directories so the second checkout cannot replace the first tree.
      # Vite writes apps/web/dist inside each checkout.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # On push, inputs.ref is empty, so the prototype ref defaults to
      # complete-loan-picture. It is not github.sha. A missing ref does not
      # fail the job: the next step copies main into prototype/.
      - name: Check out prototype
        id: prototype_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'complete-loan-picture' }}
          path: prototype

      - name: Use main when the prototype ref is missing
        if: steps.prototype_checkout.outcome == 'failure'
        run: |
          set -euo pipefail
          rm -rf prototype
          mkdir -p prototype
          cp -a main/. prototype/

      # package.json is under each checkout, not the workspace root.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            main/pnpm-lock.yaml
            prototype/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: main
        run: pnpm install --frozen-lockfile

      - name: Install prototype dependencies
        working-directory: prototype
        run: pnpm install --frozen-lockfile

      - name: Build production
        working-directory: main
        env:
          VITE_BASE: /compound/
        run: pnpm --dir apps/web build

      - name: Build prototype
        working-directory: prototype
        env:
          VITE_BASE: /compound/prototype/
        run: pnpm --dir apps/web build

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site/prototype
          cp -a main/apps/web/dist/. site/
          cp -a prototype/apps/web/dist/. site/prototype/
          test -f site/index.html
          test -f site/prototype/index.html
          grep -q '/compound/' site/index.html
          grep -q '/compound/prototype/' site/prototype/index.html
          if grep -q '/compound/prototype/' site/index.html; then
            echo "production index references /compound/prototype/" >&2
            exit 1
          fi

      - name: Check out pages-feat previews
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: pages-feat
          path: pages-feat

      - name: Merge feat previews into site
        run: |
          set -euo pipefail
          if [ -d pages-feat/feat ]; then
            mkdir -p site/feat
            cp -a pages-feat/feat/. site/feat/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
