name: deploy-feature-preview

# Publishes feat/<pull-request-number>/ on orphan gh-pages after cutover seed.
# Does not rebuild production or prototype. Until gh-pages exists, exits 0.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js 24
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build feature preview
        if: github.event.action != 'closed'
        env:
          VITE_BASE: /compound/feat/${{ github.event.pull_request.number }}/
          VITE_STORAGE_KEY: compound-amortization-feat-${{ github.event.pull_request.number }}-v1
        run: pnpm --dir apps/web build

      - name: Check out gh-pages publish script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/gh-pages-publish.sh
          sparse-checkout-cone-mode: false
          path: publish-tools

      - name: Publish feat folder on gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.action }}" = "closed" ]; then
            MSG="Remove feat preview for PR #${PR_NUMBER} (${HEAD_SHA})"
            bash publish-tools/.github/scripts/gh-pages-publish.sh feature-remove "${MSG}" "${PR_NUMBER}"
          else
            MSG="Feat preview PR #${PR_NUMBER} (${HEAD_SHA})"
            bash publish-tools/.github/scripts/gh-pages-publish.sh feature-update "${MSG}" "${PR_NUMBER}" "${GITHUB_WORKSPACE}/apps/web/dist"
            test -f apps/web/dist/index.html
            grep -q "/compound/feat/${PR_NUMBER}/" apps/web/dist/index.html
          fi
