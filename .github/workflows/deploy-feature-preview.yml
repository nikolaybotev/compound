name: deploy-feature-preview

# Publishes feat/<12-char-sha>/ builds on orphan gh-pages. Open pull requests
# also maintain feat/<pr>/index.html redirecting to the latest sha. Closing
# the pull request does not remove that pointer. Does not
# rebuild production or prototype. Dispatches deploy-gh-pages-branch.yml after
# a successful gh-pages push. Until gh-pages exists, publish exits 0.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - gh-pages

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preview-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build feature preview
        env:
          FEAT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FEAT_SHA:0:12}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          VITE_BASE="/compound/feat/${SHORT_SHA}/" \
          VITE_STORAGE_KEY="compound-amortization-feat-${{ github.event.pull_request.number }}-v1" \
          pnpm --dir apps/web build
          grep -q "/compound/feat/${SHORT_SHA}/" apps/web/dist/index.html

      - name: Check out gh-pages publish script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/gh-pages-publish.sh
            .github/scripts/dispatch-deploy-gh-pages-branch.sh
          sparse-checkout-cone-mode: false
          path: publish-tools

      - name: Publish on gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: |
          set -euo pipefail
          rm -f "${GH_PAGES_PUSH_MARKER}"
          SHORT_SHA="${HEAD_SHA:0:12}"
          MSG="Feat preview PR #${PR_NUMBER} -> ${SHORT_SHA}"
          bash publish-tools/.github/scripts/gh-pages-publish.sh feature-pr-publish "${MSG}" "${PR_NUMBER}" "${SHORT_SHA}" "${GITHUB_WORKSPACE}/apps/web/dist"

      - name: Deploy gh-pages tree to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: bash publish-tools/.github/scripts/dispatch-deploy-gh-pages-branch.sh

  preview-branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when an open pull request uses this branch
        id: open_pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, "");
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${branch}`,
              per_page: 1,
            });
            core.setOutput("has_open_pr", data.length > 0 ? "true" : "false");

      - name: Check out branch
        if: steps.open_pr.outputs.has_open_pr == 'false'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.open_pr.outputs.has_open_pr == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js 24
        if: steps.open_pr.outputs.has_open_pr == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.open_pr.outputs.has_open_pr == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build feature preview
        if: steps.open_pr.outputs.has_open_pr == 'false'
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:12}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          VITE_BASE="/compound/feat/${SHORT_SHA}/" \
          VITE_STORAGE_KEY="compound-amortization-feat-${SHORT_SHA}-v1" \
          pnpm --dir apps/web build
          grep -q "/compound/feat/${SHORT_SHA}/" apps/web/dist/index.html

      - name: Check out gh-pages publish script
        if: steps.open_pr.outputs.has_open_pr == 'false'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/gh-pages-publish.sh
            .github/scripts/dispatch-deploy-gh-pages-branch.sh
          sparse-checkout-cone-mode: false
          path: publish-tools

      - name: Publish sha folder on gh-pages
        if: steps.open_pr.outputs.has_open_pr == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: |
          set -euo pipefail
          rm -f "${GH_PAGES_PUSH_MARKER}"
          MSG="Feat preview ${SHORT_SHA}"
          bash publish-tools/.github/scripts/gh-pages-publish.sh feature-sha "${MSG}" "${SHORT_SHA}" "${GITHUB_WORKSPACE}/apps/web/dist"

      - name: Deploy gh-pages tree to GitHub Pages
        if: steps.open_pr.outputs.has_open_pr == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_PUSH_MARKER: ${{ runner.temp }}/gh-pages-pushed
        run: bash publish-tools/.github/scripts/dispatch-deploy-gh-pages-branch.sh
